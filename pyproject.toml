[project]
name = "bughunter-ai"
version = "0.1.1"
description = "Authorized security research desktop and cloud worker"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "argon2-cffi>=23.1",
    "httpx>=0.28.1,<0.29",
    "beautifulsoup4>=4.12",
    "reportlab>=4.2",
    "httpcore>=1.0.9,<2",
    "python-docx>=1.1.2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "PyJWT>=2.9,<3",
    "cryptography>=42,<47",
    "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "index:app"
