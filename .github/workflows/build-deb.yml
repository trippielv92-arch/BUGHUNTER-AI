name: Build Parrot Debian package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "config/**"
      - "packaging/**"
      - "scripts/build_deb.sh"
      - "scripts/run_parrot.sh"
      - "requirements*.txt"
      - "main.py"
      - "pyproject.toml"
      - ".github/workflows/build-deb.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - "packaging/**"
      - "scripts/build_deb.sh"
      - "scripts/run_parrot.sh"
      - "requirements*.txt"
      - "main.py"
      - "pyproject.toml"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Compile application
        run: python -m compileall -q app main.py
      - name: Run automated test suite
        run: python -m pytest -q
      - name: Build .deb
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh
      - name: Inspect Debian package
        run: |
          mapfile -t PACKAGES < <(find dist -maxdepth 1 -type f -name '*.deb' -print)
          test "${#PACKAGES[@]}" -eq 1
          PACKAGE="${PACKAGES[0]}"
          EXPECTED_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          EXPECTED_PACKAGE="bughunter-ai_${EXPECTED_VERSION}_all.deb"
          test "$(basename "$PACKAGE")" = "$EXPECTED_PACKAGE"
          test "$(dpkg-deb -f "$PACKAGE" Version)" = "$EXPECTED_VERSION"
          dpkg-deb --info "$PACKAGE"
          mkdir -p /tmp/bughunter-package
          dpkg-deb --extract "$PACKAGE" /tmp/bughunter-package
          test -x /tmp/bughunter-package/usr/bin/bughunter-ai
          test -x /tmp/bughunter-package/usr/bin/bughunter-ai-admin
          test -f /tmp/bughunter-package/opt/bughunter-ai/app/ui/main_window.py
          test -f /tmp/bughunter-package/opt/bughunter-ai/requirements-desktop.txt
          test -z "$(find /tmp/bughunter-package/opt/bughunter-ai -type d -name '__pycache__' -print -quit)"
          test -z "$(find /tmp/bughunter-package/opt/bughunter-ai -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BugHunter-AI-Parrot-DEB
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
